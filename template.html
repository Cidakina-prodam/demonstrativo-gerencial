
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Demonstrativo Gerencial</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--ae:#1F4E79;--am:#2E75B6;--ac:#BDD7EE;--ap:#DEEAF1;--pb:#D9E1F2;--db:#EDF2F8;--ab:#F5F5F5;--ob:#FFF2CC;--ot:#C55A00;--tb:#FFD966;--al:#FFF8E1;--fc:#1a6b3c;--ic:#1a3a6b;--bg:#f0f4f8;--sf:#fff;--bd:#dde3ed;--tx:#1a2332;--tm:#5a6a7e;--rd:10px;--sh:0 2px 12px rgba(31,78,121,.10);--gv:#E2EFDA;--dv:#FCE4D6;--dvt:#C00000}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.hdr{background:linear-gradient(135deg,var(--ae),var(--am));padding:24px 40px 0;box-shadow:0 4px 24px rgba(31,78,121,.25);position:sticky;top:0;z-index:100}
.hdr-top{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.logo{width:42px;height:42px;background:rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.hdr h1{font-size:1.3rem;font-weight:700;color:#fff}.hdr h1 span{font-weight:300;opacity:.75;font-size:.9rem}
.nav-tabs{display:flex;gap:2px}
.nav-tab{padding:9px 20px;border:none;background:transparent;color:rgba(255,255,255,.6);font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:500;cursor:pointer;border-radius:8px 8px 0 0;transition:all .2s;border-bottom:3px solid transparent}
.nav-tab:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.08)}.nav-tab.on{color:#fff;background:rgba(255,255,255,.15);border-bottom:3px solid #FFD966}
.cnt{padding:28px 40px;max-width:1400px;margin:0 auto}
.view-bar{display:flex;gap:8px;margin-bottom:20px;background:var(--sf);padding:5px;border-radius:var(--rd);box-shadow:var(--sh);width:fit-content}
.view-tab{padding:7px 22px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;border-radius:7px;color:var(--tm);transition:all .18s}
.view-tab:hover{background:var(--ap);color:var(--ae)}.view-tab.on{background:var(--ae);color:#fff;box-shadow:0 2px 8px rgba(31,78,121,.25)}
.nbar{display:flex;gap:8px;margin-bottom:20px;background:var(--sf);padding:5px;border-radius:var(--rd);box-shadow:var(--sh);width:fit-content}
.ntab{padding:7px 24px;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;border-radius:7px;color:var(--tm);transition:all .18s}
.ntab:hover{background:var(--ap);color:var(--ae)}.ntab.on{background:var(--ae);color:#fff;box-shadow:0 2px 8px rgba(31,78,121,.25)}
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.sinp{padding:8px 14px;border:1.5px solid var(--bd);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.82rem;width:260px;background:var(--sf);color:var(--tx)}
.sinp:focus{outline:none;border-color:var(--am)}
.xbtn{padding:8px 14px;border:1.5px solid var(--bd);border-radius:8px;background:var(--sf);font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:500;cursor:pointer;color:var(--tm);transition:all .2s}
.xbtn:hover{border-color:var(--am);color:var(--ae)}.xbtn.warn{border-color:var(--dvt);color:var(--dvt)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.tc{background:var(--sf);border-radius:var(--rd);padding:14px 18px;box-shadow:var(--sh);border-left:4px solid var(--am)}
.tc.fat{border-color:var(--fc)}.tc.nfat{border-color:#e07b39}.tc.int{border-color:var(--ic)}.tc.pos{border-color:#9b59b6}.tc.lancx{border-color:var(--fc)}.tc.divx{border-color:var(--dvt)}.tc.tot{border-color:var(--tb);background:#fffbf0}.tc.cob{border-color:#27AE60}
.tc label{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--tm);display:block;margin-bottom:3px}
.tc .val{font-family:'DM Mono',monospace;font-size:1.35rem;font-weight:600;color:var(--tx)}.tc.tot .val,.tc.cob .val{color:var(--ae);font-weight:700}
/* CRUZAMENTO */
.cruz-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.cruz-sel{display:flex;flex-direction:column;gap:6px}
.cruz-sel label{font-size:.72rem;font-weight:600;color:var(--tm);text-transform:uppercase;letter-spacing:.6px}
.period-checklist{background:var(--sf);border:1.5px solid var(--bd);border-radius:8px;padding:10px 14px;min-width:180px;box-shadow:var(--sh)}
.period-item{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:.82rem;cursor:pointer}
.period-item input{width:14px;height:14px;cursor:pointer;accent-color:var(--am)}
.period-divider{border:none;border-top:1px solid var(--bd);margin:4px 0}
.nucleo-sel{padding:8px 14px;border:1.5px solid var(--bd);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.84rem;background:var(--sf);color:var(--tx);cursor:pointer;min-width:120px}
.nucleo-sel:focus{outline:none;border-color:var(--am)}
/* TABELA CRUZAMENTO */
.cruz-table{width:100%;border-collapse:collapse;background:var(--sf);border-radius:var(--rd);overflow:hidden;box-shadow:var(--sh);margin-bottom:24px}
.cruz-table th{background:var(--ae);color:#fff;padding:10px 14px;font-size:.75rem;font-weight:600;text-align:left;letter-spacing:.5px}
.cruz-table th.right{text-align:right}
.cruz-table td{padding:10px 14px;font-size:.82rem;border-bottom:1px solid var(--bd)}
.cruz-table tr:last-child td{border-bottom:none}
.cruz-table tr:hover td{background:var(--ap)}
.cruz-table td.right{text-align:right;font-family:'DM Mono',monospace;font-size:.8rem}
.barra-wrap{width:120px;background:#eee;border-radius:4px;height:8px;display:inline-block;vertical-align:middle}
.barra-fill{height:8px;border-radius:4px;background:var(--am);transition:width .4s}
.barra-fill.high{background:#27AE60}.barra-fill.mid{background:#FFD966}.barra-fill.low{background:#e07b39}.barra-fill.zero{background:#ddd}
.pct-badge{font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:10px;display:inline-block}
.pct-badge.high{background:#d4edda;color:#1a6b3c}.pct-badge.mid{background:#fff3cd;color:#856404}.pct-badge.low{background:#fde8d8;color:#8B4513}.pct-badge.zero{background:#f0f0f0;color:#888}
.sem-pos{padding:12px 16px;background:var(--al);border-radius:8px;font-size:.82rem;color:#9e7c00;border-left:3px solid #FFD966;margin-bottom:16px}
/* GRAFICO */
.grafico-wrap{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start;margin-top:8px}
.canvas-wrap{position:relative;width:280px;height:280px}
#myCanvas{width:280px;height:280px}
.legenda{display:flex;flex-direction:column;gap:6px}
.leg-item{display:flex;align-items:center;gap:6px;font-size:.8rem}
.leg-cor{width:14px;height:14px;border-radius:3px;flex-shrink:0}
.leg-nome{color:var(--tx)}
.leg-pct{font-family:'DM Mono',monospace;font-size:.78rem;color:var(--ae);font-weight:600;margin-left:2px}
.leg-h{font-family:'DM Mono',monospace;font-size:.75rem;color:var(--tm);margin-left:4px}
/* POSICIONAL */
.sec-card{background:var(--sf);border-radius:var(--rd);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;border:1.5px solid var(--bd)}
.sec-hdr{display:flex;align-items:center;padding:12px 18px;background:var(--am);cursor:pointer;gap:12px}
.sec-hdr:hover{background:#2566a0}
.sec-nome{font-weight:700;font-size:.9rem;flex:1;color:#fff}.sec-horas{font-family:'DM Mono',monospace;font-weight:600;color:#fff;margin-right:8px}
.sec-chv{font-size:.7rem;color:rgba(255,255,255,.8);transition:transform .2s}.sec-card.op .sec-chv{transform:rotate(180deg)}
.sec-body{display:none;padding:10px 14px 14px}.sec-card.op .sec-body{display:block}
.os-sep{background:var(--ae);color:#fff;font-size:.73rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 14px;border-radius:6px;margin:10px 0 8px;display:inline-block}
.proj-card{background:var(--ac);border-radius:8px;margin-bottom:8px;overflow:hidden;border:1px solid #a8c8e8}
.proj-hdr{display:flex;align-items:center;padding:9px 14px;cursor:pointer;gap:10px}
.proj-hdr:hover{background:#aecde6}
.proj-nome{font-weight:700;font-size:.83rem;flex:1;color:var(--ae)}.proj-horas{font-family:'DM Mono',monospace;font-size:.85rem;color:var(--ae)}
.proj-chv{font-size:.65rem;color:var(--ae);transition:transform .2s;margin-left:6px}.proj-card.op .proj-chv{transform:rotate(180deg)}
.proj-body{display:none;padding:8px 12px 10px}.proj-card.op .proj-body{display:block}
.dem-block{margin-bottom:6px}
.dem-hdr{display:flex;align-items:center;padding:6px 10px;background:var(--ap);border-radius:6px;cursor:pointer;gap:8px}
.dem-hdr:hover{background:#cfe2ed}.dem-hdr.div-flag{background:#fde8d8;border-left:3px solid var(--dvt)}
.dem-desc{font-size:.8rem;font-weight:600;flex:1;color:var(--tx)}.dem-horas{font-family:'DM Mono',monospace;font-size:.82rem;color:var(--tm)}
.div-badge{font-size:.65rem;background:var(--dvt);color:#fff;padding:1px 7px;border-radius:10px;white-space:nowrap}
.dem-chv{font-size:.62rem;color:var(--tm);transition:transform .2s;margin-left:4px}.dem-block.op .dem-chv{transform:rotate(180deg)}
.dem-body{display:none;padding-left:10px;padding-top:4px}.dem-block.op .dem-body{display:block}
.col-block{background:var(--gv);border-radius:6px;margin-bottom:4px;overflow:hidden}
.col-hdr{display:flex;align-items:center;padding:6px 10px;cursor:pointer;gap:8px}.col-hdr:hover{background:#d4e8cc}
.col-av{width:26px;height:26px;background:var(--ae);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.65rem;font-weight:700;flex-shrink:0}
.col-nome{font-size:.8rem;font-weight:600;flex:1;color:var(--ae)}.col-horas{font-family:'DM Mono',monospace;font-size:.82rem;color:var(--ae)}
.col-chv{font-size:.6rem;color:var(--ae);transition:transform .2s;margin-left:4px}.col-block.op .col-chv{transform:rotate(180deg)}
.col-body{display:none;padding:0 10px 8px}.col-block.op .col-body{display:block}
.lanc-row{display:flex;align-items:center;padding:4px 8px;background:var(--ab);border-radius:4px;margin-bottom:2px;gap:8px;font-size:.74rem}
.lanc-desc{flex:1;color:var(--tx)}.lanc-data{color:var(--tm);min-width:50px;font-size:.7rem}.lanc-h{font-family:'DM Mono',monospace;color:var(--tm);min-width:38px;text-align:right}
.div-msg{background:var(--dv);border-left:3px solid var(--dvt);padding:6px 10px;border-radius:4px;font-size:.75rem;color:var(--dvt);margin-bottom:4px}
/* LANÇAMENTOS */
.tipo-sep{background:var(--am);color:#fff;font-size:.75rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:6px 14px;border-radius:7px;margin:14px 0 8px}
.cc{background:var(--sf);border-radius:var(--rd);box-shadow:var(--sh);margin-bottom:8px;overflow:hidden;border:1.5px solid var(--bd)}
.ch{display:flex;align-items:center;padding:12px 18px;background:var(--ac);cursor:pointer;user-select:none;gap:12px}.ch:hover{background:#aecde6}
.av{width:34px;height:34px;background:var(--ae);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.8rem;font-weight:700;flex-shrink:0}
.cn{font-weight:700;font-size:.9rem;flex:1;color:var(--ae)}.ce{font-size:.75rem;color:var(--tm);margin-right:10px}
.cH{font-family:'DM Mono',monospace;font-weight:600;font-size:.95rem;color:var(--ae);min-width:65px;text-align:right}
.chv{font-size:.72rem;color:var(--am);transition:transform .2s;margin-left:6px}.cc.op .chv{transform:rotate(180deg)}
.cb{display:none;padding:10px 16px 14px}.cc.op .cb{display:block}
.sl{padding:9px 12px;background:var(--al);border-radius:6px;font-size:.8rem;color:#9e7c00;border-left:3px solid #FFD966}
.catb{margin-bottom:10px}
.cath{display:flex;align-items:center;padding:6px 10px;background:var(--ap);border-radius:6px;cursor:pointer;gap:8px;margin-bottom:5px}.cath:hover{background:#cfe2ed}
.cbg{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:20px}
.cbg.fat{background:#d4edda;color:var(--fc)}.cbg.nfat{background:#fde8d8;color:#8B4513}.cbg.int{background:#dce8f5;color:var(--ic)}
.caH{font-family:'DM Mono',monospace;font-size:.85rem;font-weight:600;color:var(--tm);margin-left:auto}
.cav{font-size:.68rem;color:var(--tm);transition:transform .2s}.catb.op .cav{transform:rotate(180deg)}
.catbd{display:none;padding-left:8px}.catb.op .catbd{display:block}
.pb{margin-bottom:5px}
.ph{display:flex;align-items:center;padding:5px 9px;background:var(--pb);border-radius:6px;cursor:pointer;gap:8px;margin-bottom:3px}.ph:hover{background:#c5cfe8}
.pn{font-size:.8rem;font-weight:600;flex:1;color:var(--tx)}.pc{font-size:.72rem;color:var(--tm)}
.pH{font-family:'DM Mono',monospace;font-size:.82rem;color:var(--tm)}
.pv{font-size:.62rem;color:var(--tm);transition:transform .2s}.pb.op .pv{transform:rotate(180deg)}
.pbd{display:none;padding-left:10px}.pb.op .pbd{display:block}
.gb{margin-bottom:3px}
.gh{display:flex;align-items:center;padding:4px 9px;background:var(--db);border-radius:5px;cursor:pointer;gap:8px;margin-bottom:2px;font-size:.75rem;font-style:italic}.gh:hover{background:#dde7f2}
.gl{flex:1;color:var(--tm)}.gH{font-family:'DM Mono',monospace;font-size:.77rem;color:var(--tm)}
.gv2{font-size:.58rem;color:var(--tm);transition:transform .2s}.gb.op .gv2{transform:rotate(180deg)}
.gbd{display:none;padding-left:10px}.gb.op .gbd{display:block}
.ar{display:flex;align-items:center;padding:4px 9px;background:var(--ab);border-radius:4px;margin-bottom:2px;gap:8px;font-size:.75rem}
.ar.op2{background:var(--ob)}.ai{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--am);min-width:58px}
.at{flex:1;color:var(--tx)}.ar.op2 .at{color:var(--ot);font-style:italic}
.abg{font-size:.62rem;padding:1px 5px;border-radius:10px;background:rgba(31,78,121,.1);color:var(--ae);white-space:nowrap}
.ad{font-size:.7rem;color:var(--tm);min-width:32px;text-align:center}.aH{font-family:'DM Mono',monospace;font-size:.77rem;color:var(--tm);min-width:40px;text-align:right}
.mes-panel{display:none}.mes-panel.on{display:block}
.view-panel{display:none}.view-panel.on{display:block}
.np{display:none}.np.on{display:block}
.hs{display:none!important}
@media(max-width:768px){.cnt{padding:14px}.hdr{padding:14px 14px 0}.tgrid{grid-template-columns:repeat(2,1fr)}.grafico-wrap{grid-template-columns:1fr}}
.drw-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200}
.drw-overlay.on{display:block}
.drw{position:fixed;right:0;top:0;height:100vh;width:480px;max-width:95vw;background:var(--sf);
  box-shadow:-4px 0 24px rgba(0,0,0,.15);z-index:201;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s}
.drw.on{transform:translateX(0)}
.drw-hdr{background:var(--ae);padding:16px 20px;display:flex;align-items:center;gap:12px}
.drw-hdr h2{color:#fff;font-size:1rem;font-weight:700;flex:1}
.drw-close{background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;padding:4px 8px}
.drw-body{padding:16px 20px;overflow-y:auto;flex:1}
.drw-sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.drw-sum-card{background:var(--ap);border-radius:8px;padding:10px 12px}
.drw-sum-card label{font-size:.65rem;font-weight:600;text-transform:uppercase;color:var(--tm);display:block;margin-bottom:2px}
.drw-sum-card .val{font-family:'DM Mono',monospace;font-size:1rem;font-weight:600;color:var(--ae)}
.drw-gdp-block{margin-bottom:8px;background:var(--sf);border:1.5px solid var(--bd);border-radius:8px;overflow:hidden}
.drw-gdp-hdr{display:flex;align-items:center;padding:8px 12px;gap:8px;background:var(--ap)}
.drw-gdp-nome{font-size:.8rem;font-weight:600;flex:1;color:var(--tx)}
.drw-gdp-horas{font-family:'DM Mono',monospace;font-size:.8rem;color:var(--tm)}
.drw-status{font-size:.62rem;font-weight:700;padding:1px 7px;border-radius:10px;color:#fff;white-space:nowrap}
.drw-fat-badge{font-size:.65rem;padding:1px 6px;border-radius:8px;font-weight:600}
.drw-fat-badge.sim{background:#d4edda;color:var(--fc)}.drw-fat-badge.nao{background:#fde8d8;color:#8B4513}
.drw-proj-label{font-size:.72rem;color:var(--tm);padding:4px 12px 6px;font-style:italic}

.drill-row td{padding:0!important;border:none}
.drill-wrap{padding:0 14px 12px 48px;background:#fafbfd;border-top:1px solid var(--bd)}
.drill-proj{font-size:.74rem;color:var(--tm);font-style:italic;padding:6px 0 4px;font-weight:600}
.drill-gdp-row{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:5px;margin-bottom:3px;font-size:.78rem}
.drill-gdp-row.fat-sim{background:#f0faf3;border-left:3px solid #27AE60}
.drill-gdp-row.fat-nao{background:#fdf5f0;border-left:3px solid #e07b39}
.drill-gdp-id{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--tm);min-width:90px}
.drill-gdp-nome{flex:1;color:var(--tx)}
.drill-st-badge{font-size:.62rem;font-weight:700;padding:1px 6px;border-radius:8px;color:#fff;white-space:nowrap}
.drill-fat-badge{font-size:.65rem;font-weight:700;padding:1px 7px;border-radius:8px;white-space:nowrap}
.drill-fat-badge.sim{background:#d4edda;color:#1a6b3c}
.drill-fat-badge.nao{background:#fde8d8;color:#8B4513}
.drill-horas{font-family:'DM Mono',monospace;font-size:.78rem;color:var(--tm);min-width:45px;text-align:right}
.drill-empty{font-size:.76rem;color:#9e7c00;padding:6px 8px;background:var(--al);border-radius:5px;border-left:3px solid #FFD966}
tr.cruz-tr-open td{background:var(--ap)}


.col-block.excesso .col-hdr{background:#fde8d8;}
.col-block.excesso .col-hdr:hover{background:#fbd4bc;}
.col-block.excesso .col-nome{color:#C00000;}
.col-block.excesso .col-horas{color:#C00000;}
.col-block.excesso .col-av{background:#C00000;}
.excesso-badge{font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:8px;background:#fde8d8;color:#C00000;white-space:nowrap;margin-left:4px;}
/* COMBO MÊS */
.mes-combo-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.mes-combo-wrap label{font-size:.75rem;font-weight:600;color:var(--tm);text-transform:uppercase;letter-spacing:.6px}
.mes-combo{padding:7px 14px;border:1.5px solid var(--bd);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.84rem;background:var(--sf);color:var(--tx);cursor:pointer;min-width:160px}
.mes-combo:focus{outline:none;border-color:var(--am)}


.lanc-row.invalido{background:#fde8d8;border-left:3px solid #C00000;}
.lanc-row.invalido .lanc-desc{color:#C00000;}
.lanc-row.invalido .ativ-id{color:#C00000;}
.inv-badge{font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:6px;background:#C00000;color:#fff;white-space:nowrap;flex-shrink:0}


.ativ-faltando{display:flex;align-items:center;gap:8px;padding:5px 10px;background:#fde8d8;border-left:3px solid #C00000;border-radius:5px;margin-bottom:3px;font-size:.76rem;}
.ativ-faltando .af-id{font-family:'DM Mono',monospace;font-size:.7rem;color:#C00000;font-weight:700;min-width:70px;}
.ativ-faltando .af-label{color:#C00000;font-weight:600;}


/* ── OPERAÇÃO ASSISTIDA ─────────────────────────────────────── */
.oa-card{background:var(--sf);border-radius:var(--rd);box-shadow:var(--sh);margin-bottom:8px;overflow:hidden;border:1.5px solid var(--bd)}
.oa-hdr{display:flex;align-items:center;padding:11px 16px;background:var(--ac);cursor:pointer;gap:10px}.oa-hdr:hover{background:#aecde6}
.oa-av{width:30px;height:30px;background:var(--ae);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-weight:700;flex-shrink:0}

var cruzState={periodos:null,nucleo:"NSS1",mesIdx:null};

function initCruz(){
  cruzState.periodos=CRUZ.map(function(){return true;});
  renderCruz();
}

function renderCruz(){
  var wrap=document.getElementById("cruzWrap_"+cruzState.nucleo); if(!wrap)return;
  wrap.innerHTML="";
  var rowMap={};var drillMap={};

  // Filtrar meses selecionados
  // Usar mês do combo quando disponível
  var mesesSel;
  if(mesState&&mesState.idx!==undefined){
    mesesSel=[CRUZ[mesState.idx]].filter(Boolean);
  } else {
    mesesSel=CRUZ.filter(function(_,i){return cruzState.periodos[i];});
  }
  var nKey=cruzState.nucleo;

  // Consolidar dados
  var colabMap={};
  var temPos=false;
  mesesSel.forEach(function(mes){
    if(mes.tem_posicional)temPos=true;
    var posNucleo=mes.nucleos.find(function(p){return p.nome===nKey;});
    if(!posNucleo)return;
    posNucleo.colaboradores.forEach(function(c){
      if(!colabMap[c.rf]){colabMap[c.rf]={nome:c.nome,rf:c.rf,espec:c.espec,tipo:c.tipo||"",lancado:0,faturado:0,externo:c.externo||false,drill:c.drill||[]};}
      colabMap[c.rf].lancado+=c.lancado;
      colabMap[c.rf].faturado+=c.faturado;
      if(c.drill&&c.drill.length>0&&colabMap[c.rf].drill.length===0){colabMap[c.rf].drill=c.drill;}
    });
  });

  var lista=Object.values(colabMap).map(function(c){
    c.lancado=Math.round(c.lancado*10)/10;
    c.faturado=Math.round(c.faturado*10)/10;
    c.nao_fat=Math.round(Math.max(c.lancado-c.faturado,0)*10)/10;
    c.pct_fat=c.lancado>0?Math.round(c.faturado/c.lancado*1000)/10:0;
    return c;
  }).sort(function(a,b){return b.faturado-a.faturado;});

  var tot_fat=Math.round(lista.reduce(function(s,c){return s+c.faturado;},0)*10)/10;
  var tot_lanc=Math.round(lista.reduce(function(s,c){return s+c.lancado;},0)*10)/10;
  lista.forEach(function(c){c.pct_contrib=tot_fat>0?Math.round(c.faturado/tot_fat*1000)/10:0;});

  // Aviso sem posicional
  if(!temPos){
    wrap.appendChild(mk("div","sem-pos","\u26A0 Posicional n\u00E3o dispon\u00EDvel para os per\u00EDodos selecionados. Os dados de faturamento aparecer\u00E3o zerados."));
  }

  // Cards totais
  var grid=mk("div","tgrid");

  [{c:"lancx",l:"Total Lan\u00E7ado",v:fmtH(tot_lanc)},{c:"pos",l:"Total Faturado",v:fmtH(tot_fat)},{c:"cob",l:"Cobertura",v:cob+"%"},{c:"nfat",l:"N\u00E3o Faturado",v:fmtH(tot_lanc-tot_fat)}].forEach(function(x){

      var show=!q||c.nome.toLowerCase().includes(q);
      if(row){row.style.display=show?"":"none";}
      if(drill){drill.style.display="none";}

        if(next.style.display!=="none")hasVisible=true;
        next=next.nextElementSibling;
        if(next&&next.classList.contains("drill-row"))next=next.nextElementSibling;

      sep.style.display=hasVisible?"":"none";

  sortBar.appendChild(sortLeft);sortBar.appendChild(srchInp);

  function aplicarSort(){

    var total=comFat.reduce(function(s,c){return s+c.faturado;},0);
    var angle=-Math.PI/2;
    ctx.clearRect(0,0,280,280);
    if(total===0){
      ctx.beginPath();ctx.arc(cx,cy,ro,0,Math.PI*2);ctx.strokeStyle="#eee";ctx.lineWidth=50;ctx.stroke();
      ctx.fillStyle="var(--tm)";ctx.font="bold 14px DM Sans";ctx.textAlign="center";ctx.fillText("Sem dados",cx,cy);
      return;
    }
    comFat.forEach(function(c,i){
      var slice=c.faturado/total*Math.PI*2;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,ro,angle,angle+slice);ctx.closePath();
      ctx.fillStyle=CORES[i%CORES.length];ctx.fill();
      // Horas dentro da fatia (se grande o suficiente)
      if(slice>0.25){
        var mid=angle+slice/2;
        var tx=cx+Math.cos(mid)*(ri+(ro-ri)*0.52);
        var ty=cy+Math.sin(mid)*(ri+(ro-ri)*0.52);
        ctx.fillStyle="#fff";
        ctx.font="bold 10px DM Sans";ctx.textAlign="center";ctx.textBaseline="middle";
        ctx.fillText(fmtH(c.faturado),tx,ty);
      }
      angle+=slice;
    });
    ctx.beginPath();ctx.arc(cx,cy,ri,0,Math.PI*2);ctx.fillStyle="#f0f4f8";ctx.fill();
    ctx.fillStyle="#1F4E79";ctx.font="bold 18px DM Sans";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(fmtH(total),cx,cy-8);
    ctx.font="11px DM Sans";ctx.fillStyle="#5a6a7e";ctx.fillText("faturado",cx,cy+10);
  },50);
}

  // Consolidar núcleos de todos os meses selecionados

  vl.appendChild(bViewLanc(n.lkey,nid));np.appendChild(vl);
  // View 2: Desempenho de Faturamento
  var vc=mk("div","view-panel");
  // Controles
  var ctrl=mk("div","cruz-header");
  // Checklist de períodos
  var pSel=mk("div","cruz-sel");pSel.appendChild(mk("label","","Per\u00EDodo de refer\u00EAncia"));
  var pList=mk("div","period-checklist");
  // Selecionar todos
  var allItem=mk("div","period-item");
  var allCk=document.createElement("input");allCk.type="checkbox";allCk.id="checkAll_"+n.nome;allCk.checked=true;
  allCk.onchange=function(){
    document.querySelectorAll(".period-check").forEach(function(c){c.checked=allCk.checked;});
    cruzState.periodos=CRUZ.map(function(){return allCk.checked;});
    renderCruz();
  };
  allItem.appendChild(allCk);allItem.appendChild(mk("span",null,"Selecionar todos"));
  pList.appendChild(allItem);
  var divider=document.createElement("hr");divider.className="period-divider";pList.appendChild(divider);
  CRUZ.forEach(function(mes,mi){
    var item=mk("div","period-item");
    var ck=document.createElement("input");ck.type="checkbox";ck.className="period-check period-check-"+n.nome;ck.checked=true;
    ck.dataset.idx=mi;(function(nome){ck.onchange=function(){
      var checks=document.querySelectorAll(".period-check-"+nome);
      var allCkEl=document.getElementById("checkAll_"+nome);
      var allOn=Array.from(checks).every(function(c){return c.checked;});
      if(allCkEl)allCkEl.checked=allOn;
      cruzState.periodos=Array.from(checks).map(function(c){return c.checked;});
      cruzState.nucleo=nome;renderCruz();
    };})(n.nome);
    item.appendChild(ck);item.appendChild(mk("span",null,mes.label+(mes.tem_posicional?"":" \u26A0")));
    pList.appendChild(item);
  });
  pSel.appendChild(pList);ctrl.appendChild(pSel);
  vc.appendChild(ctrl);
  // Wrap para resultado
  var cruzWrap=mk("div");cruzWrap.id="cruzWrap_"+n.nome;vc.appendChild(cruzWrap);
  np.appendChild(vc);
  // View 3: Op. Assistida (independente de núcleo — compartilhado)
  var voa=mk("div","view-panel");
  var oaContainer=mk("div");oaContainer.id="oaPanel";voa.appendChild(oaContainer);
  // renderOA é chamado automaticamente pelo swView quando vi===3
  np.appendChild(voa);
  panel.appendChild(np);
});
MN.appendChild(panel);
cruzState.nucleo=NUCLEOS[0].nome;initCruz();
// Inicializar OA: apontar para o último mês disponível
if(OA&&!OA.nucleos){var _oaK=Object.keys(OA);oaState.mesIdx=_oaK.length>0?_oaK.length-1:0;}else{oaState.mesIdx=0;}

function abrirDrw(colab_rf, nucleo_key, mes_indices){
  var drw=document.getElementById("drw");
  var overlay=document.getElementById("drwOverlay");
  var body=document.getElementById("drwBody");
  var nomeEl=document.getElementById("drwNome");

  // Achar o colaborador nos dados de cruzamento
  var colab=null;
  CRUZ.forEach(function(mes,mi){
    if(!mes_indices.includes(mi))return;
    var n=mes.nucleos.find(function(x){return x.nome===nucleo_key;});
    if(!n)return;
    var c=n.colaboradores.find(function(x){return x.rf.toLowerCase()===colab_rf.toLowerCase();});
    if(c&&!colab)colab=c;
  });

  if(!colab)return;
  nomeEl.textContent=colab.nome;
  body.innerHTML="";

  // Sumário
  var sum=mk("div","drw-sum");
  [{l:"Lan\u00E7ado",v:fmtH(colab.lancado)},{l:"Faturado",v:fmtH(colab.faturado)},{l:"% Fat.",v:colab.pct_fat+"%"}].forEach(function(x){
    var card=mk("div","drw-sum-card");card.appendChild(mk("label","",x.l));card.appendChild(mk("div","val",x.v));sum.appendChild(card);
  });
  body.appendChild(sum);

  // Buscar lançamentos faturáveis do colaborador nos dados de lançamentos
  var nucleo_lanc=LANC[nucleo_key];
  if(!nucleo_lanc){body.appendChild(mk("div","sl","Dados de lan\u00E7amentos n\u00E3o dispon\u00EDveis."));drw.classList.add("on");overlay.classList.add("on");return;}

  var colab_lanc=null;
  nucleo_lanc.grupos.forEach(function(g){
    g.colaboradores.forEach(function(c){
      if(c.rf&&c.rf.toLowerCase()===colab_rf.toLowerCase())colab_lanc=c;
    });
  });

  if(!colab_lanc){
    // Tentar pelo nome
    nucleo_lanc.grupos.forEach(function(g){
      g.colaboradores.forEach(function(c){
        if(c.nome.toLowerCase()===colab.nome.toLowerCase())colab_lanc=c;
      });
    });
  }

  if(!colab_lanc||colab_lanc.categorias.length===0){
    body.appendChild(mk("div","sl","Sem lan\u00E7amentos fatur\u00E1veis encontrados."));
    drw.classList.add("on");overlay.classList.add("on");return;
  }

  var titulo=mk("h3");titulo.textContent="Lan\u00E7amentos Fatur\u00E1veis por GDP";titulo.style.cssText="font-size:.82rem;color:var(--ae);margin-bottom:10px;font-weight:700";
  body.appendChild(titulo);

  // Mostrar só categoria Faturável
  var cat_fat=colab_lanc.categorias.find(function(c){return c.key==="fat";});
  if(!cat_fat){body.appendChild(mk("div","sl","Nenhum lan\u00E7amento fatur\u00E1vel."));drw.classList.add("on");overlay.classList.add("on");return;}

  cat_fat.projetos.forEach(function(proj){
    var plabel=mk("div","drw-proj-label","Projeto: "+proj.nome+" / "+proj.cliente);body.appendChild(plabel);
    proj.gdps.forEach(function(gdp){
      var blk=mk("div","drw-gdp-block");
      var hdr=mk("div","drw-gdp-hdr");
      var gname=mk("span","drw-gdp-nome","GDP:"+gdp.gdp+" — "+gdp.tipo);
      hdr.appendChild(gname);
      // Status do GDP
      var st_info=STATUS_MAP[gdp.gdp]||STATUS_MAP[gdp.gds]||null;
      var faturado=false;
      if(st_info&&st_info.status){
        var sb=mk("span","drw-status");sb.textContent=st_info.status;
        var STATUS_FAT=["Execu\u00e7\u00e3o","Homologa\u00e7\u00e3o","Homolog. Expressa","Conclu\u00edda","Conclu\u00edda (integra\u00e7\u00e3o)"];
        faturado=STATUS_FAT.indexOf(st_info.status)>=0;
        var CORES_ST={"Execu\u00e7\u00e3o":"#27AE60","Homologa\u00e7\u00e3o":"#2E75B6","Homolog. Expressa":"#2E75B6","Conclu\u00edda":"#7F8C8D","Conclu\u00edda (integra\u00e7\u00e3o)":"#7F8C8D","Cancelada":"#E74C3C","Planejamento":"#F39C12","Planej. Aprovado":"#F39C12","Aprovar Planej.":"#E07B39","Aberta":"#9B59B6"};
        sb.style.cssText="font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:8px;white-space:nowrap;color:#fff;background:"+(CORES_ST[st_info.status]||"#888");
        hdr.appendChild(sb);
      }
      var fatBadge=mk("span","drw-fat-badge "+(faturado?"sim":"nao"),faturado?"Faturado":"N\u00E3o faturado");
      hdr.appendChild(fatBadge);
      hdr.appendChild(mk("span","drw-gdp-horas",fmtH(gdp.horas)));
      blk.appendChild(hdr);body.appendChild(blk);
    });
  });

  drw.classList.add("on");overlay.classList.add("on");
}

function fecharDrw(){
  document.getElementById("drw").classList.remove("on");
  document.getElementById("drwOverlay").classList.remove("on");
}

</script>

<div class="drw-overlay" id="drwOverlay" onclick="fecharDrw()"></div>
<div class="drw" id="drw">
  <div class="drw-hdr">
    <h2 id="drwNome">Colaborador</h2>
    <button class="drw-close" onclick="fecharDrw()">&#10005;</button>
  </div>
  <div class="drw-body" id="drwBody"></div>
</div></body>
</html>
